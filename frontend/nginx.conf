server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # `/` is pages/index.html; extensionless routes resolve to pages/<name>.html.
  # try_files serves inside this location, so the .html regex block below does
  # not apply here and the header is set directly.
  location = / {
    add_header Cache-Control "no-store" always;
    try_files /pages/index.html =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri /pages/$uri.html =404;
  }

  # Holds the API address, so it must never be cached.
  location = /scripts/config.js {
    add_header Cache-Control "no-store" always;
  }

  # The HTML shell names every script and stylesheet, so it is never cached.
  location ~* \.html$ {
    add_header Cache-Control "no-store" always;
  }

  # Filenames carry no content hash, so these revalidate on every request and
  # normally return 304. `no-cache` stores the copy but always revalidates.
  location ~* \.(css|js|svg|woff2?)$ {
    add_header Cache-Control "no-cache" always;
  }

  # Images change with the file itself rather than with a deploy.
  location ~* \.(webp|png|jpg|jpeg|gif|ico)$ {
    add_header Cache-Control "public, max-age=86400" always;
  }

  # Same-origin API path, generated at container start from $API_PROXY_PASS.
  # Always written, empty when unset, since nginx fails on a missing include.
  include /etc/nginx/palroute-api.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
